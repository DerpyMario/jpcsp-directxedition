name: CI

on:
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:
    branches: [ master ]
  # Allows building any branch on demand, e.g. to check the Direct3D 11 wrapper
  workflow_dispatch:

jobs:
  # The Direct3D 11 wrapper backing the DirectX 11 renderer. It is Windows only
  # and therefore cannot be built by the Ant build running on Linux below, which
  # just packages the resulting DLL.
  directx11-wrapper:
    name: DirectX 11 wrapper (${{ matrix.platform }})
    runs-on: windows-latest
    # The wrapper is an optional component: without it Jpcsp falls back to
    # OpenGL, so a failure here must not hold back the release builds
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            architecture: x64
          - platform: windows-x86
            architecture: Win32
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S jni/directx11 -B jni/directx11/build -A ${{ matrix.architecture }}

      - name: Build
        run: cmake --build jni/directx11/build --config Release

      - name: Publishing the DirectX 11 wrapper
        uses: actions/upload-artifact@v7
        with:
          name: jpcsp-directx11-${{ matrix.platform }}
          path: jni/directx11/build/Release/jpcsp-directx11.dll
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: directx11-wrapper
    # Build and publish Jpcsp even when the optional wrapper could not be built
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'

      # Everything under lib/<platform> is packaged into the distribution of
      # that platform, so dropping the wrapper there is all it takes to ship it
      - name: Collecting the DirectX 11 wrapper (64-bit)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: jpcsp-directx11-windows-amd64
          path: lib/windows-amd64

      - name: Collecting the DirectX 11 wrapper (32-bit)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: jpcsp-directx11-windows-x86
          path: lib/windows-x86

      - name: Build with Ant
        run: ant -f build-auto.xml dist
        
      - name: Move builds to appropriate artifact folders
        run: |
          # Remove all unnecessary build folders since we will only release builds archived with 7-Zip
          cd dist
          rm -R -- */
          cd ..
          # Make directories for artifact releases and move each build to their respective folders
          mkdir -p dist/{buildWindows/x86,buildWindows/amd64,buildLinux/x86,buildLinux/amd64,buildmacOS}
          mv dist/*linux-amd64* dist/buildLinux/amd64/
          mv dist/*linux-x86* dist/buildLinux/x86/
          mv dist/*windows-x86* dist/buildWindows/x86/
          mv dist/*windows-amd64* dist/buildWindows/amd64/
          mv dist/*macosx* dist/buildmacOS/
     
      - name: Publishing Windows 32-bit build
        uses: actions/upload-artifact@v7
        with:
          name: Windows 32-bit build
          path: dist/buildWindows/x86

      - name: Publishing Windows 64-bit build
        uses: actions/upload-artifact@v7
        with:
          name: Windows 64-bit build
          path: dist/buildWindows/amd64
      
      - name: Publishing Linux 32-bit build
        uses: actions/upload-artifact@v7
        with:
          name: Linux 32-bit build
          path: dist/buildLinux/x86

      - name: Publishing Linux 64-bit build
        uses: actions/upload-artifact@v7
        with:
          name: Linux 64-bit build
          path: dist/buildLinux/amd64

      - name: Publishing macOS build
        uses: actions/upload-artifact@v7
        with:
          name: macOS build
          path: dist/buildmacOS
          
      - name: Release tagged builds
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/buildLinux/x86/*.7z
            dist/buildLinux/amd64/*.7z
            dist/buildmacOS/*.7z
            dist/buildWindows/x86/*.7z
            dist/buildWindows/amd64/*.7z
